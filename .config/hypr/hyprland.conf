################
### MONITORS ###
################

monitor = DP-4, highres@highrr, 0x0, 1.25, bitdepth, 10
monitor = DP-5, highres@highrr, 3072x0, 1

# For others
monitor = , preferred, auto, 1

###################
### MY PROGRAMS ###
###################

$terminal = footclient
$fileManager = thunar
$menu = fuzzel
$browser = firefox

#################
### AUTOSTART ###
#################

exec-once = systemctl --user enable --now hypridle
exec-once = systemctl --user enable --now hyprpaper
exec-once = systemctl --user enable --now hyprsunset
exec-once = systemctl --user enable --now hyprpolkitagent

exec-once = systemctl --user enable --now waybar
exec-once = systemctl --user enable --now foot-server
exec-once = systemctl --user enable --now fnott

exec-once = uwsm app -- nm-applet
exec-once = uwsm app -- blueman-applet
exec-once = uwsm app -- wl-paste --watch cliphist store
exec-once = uwsm app -- tmux new-session -d

# GTK Theme - for some reason need to set cursor theme every boot, might as well set the rest too
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Gruvbox-Plus-Dark'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Capitaine Cursors (Gruvbox) - White'
exec-once = gsettings set org.gnome.desktop.interface font-name 'BlexMono Nerd Font Propo 11'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

exec-once = hyprctl hyprsunset identity

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See ~/.config/uwsm/env-hyprland

#####################
### LOOK AND FEEL ###
#####################

source = ~/.config/hypr/color.conf

general {
	gaps_in = 5
	gaps_out = 10

	border_size = 2

	col.active_border = $fg1
	col.inactive_border = $bg2

	resize_on_border = false

	allow_tearing = false

	layout = scrolling
}

scrolling {
  focus_fit_method = 1
}

decoration {
	rounding = 0
  rounding_power = 4.0

	active_opacity = 1.0
	inactive_opacity = 1.0

	shadow {
		enabled = true
    range = 10
	}

	blur {
		enabled = true
		size = 2
		passes = 2
    new_optimizations = true
    contrast = 1.0
    brightness = 1.0
    vibrancy = 1.0
	}
}

animations {
	enabled = true
  workspace_wraparound = false
  bezier = coolBezier, 0.83, 0, 0.17, 1

	animation = windows, 1, 1, coolBezier, slide
	animation = windowsOut, 0, 1, coolBezier
	animation = border, 1, 1, coolBezier
	animation = borderangle, 0, 1, coolBezier
	animation = fade, 1, 1, coolBezier
	animation = workspaces, 1, 1, coolBezier
	animation = layers, 1, 1, coolBezier
	animation = layersOut, 1, 1, coolBezier, slide

  animation = specialWorkspace, 1, 1, coolBezier, slidevert -50%
}

dwindle {
	pseudotile = true
	preserve_split = true
}

master {
	new_status = master
}

device {
  name = 'sony-interactive-entertainment-wireless-controller-touchpad'
  enabled = false
}

misc {
	force_default_wallpaper = 1
	disable_hyprland_logo = true
  disable_splash_rendering = true
	background_color = $bg
	middle_click_paste = false
	animate_manual_resizes = true
	vrr = 0 # Sucks ass, flickery
  font_family = BlexMono Nerd Font
}

render {
  cm_fs_passthrough = 1
}

xwayland {
  force_zero_scaling = true
}

#############
### INPUT ###
#############

input {
	kb_layout = us
	repeat_delay = 300
	repeat_rate = 75

	follow_mouse = 1

	sensitivity = 0

	accel_profile = flat

	touchpad {
		natural_scroll = false
	}
}

cursor {
	inactive_timeout = 5
}

####################
### KEYBINDINGSS ###
####################

$mainMod = SUPER

# Start apps, on dedicated workspaces
bind = $mainMod, Q, exec, [workspace 1 silent] uwsm app -- $terminal -e tmux a # Main terminal, with tmux session always
bind = $mainMod, Q, workspace, 1
bind = $mainMod, B, exec, [workspace 2 silent] uwsm app -- code # Debugger
bind = $mainMod, B, workspace, 2
bind = $mainMod, W, exec, [workspace 3 silent] uwsm app -- $browser # Main web browsing
bind = $mainMod, W, workspace, 3
# bind = $mainMod, W, exec, [workspace 4 silent] uwsm app -- # something
# bind = $mainMod, W, workspace, 4
bind = $mainMod, G, exec, [workspace 5 silent] uwsm app -- steam # Games
bind = $mainMod, G, workspace, 5

bind = $mainMod, D, exec, [workspace 6 silent] uwsm app -- $browser # Secondary web browsing (docs, background noise, etc)
bind = $mainMod, D, workspace, 6
bind = $mainMod, M, exec, [workspace 7 silent] uwsm app -- spotify # Music
bind = $mainMod, M, workspace, 7

# Fuzzel scripts
bind = $mainMod, P, exec, fuzzel-power-menu.sh
bind = $mainMod, Y, exec, fuzzel-cliphist.sh
bind = $mainMod, F, exec, fuzzel-files.sh
bind = $mainMod, O, exec, fuzzel-windows.sh
bind = $mainMod, A, exec, fuzzel-actions.sh

# Start apps anywhere
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, R, exec, $menu

# Dropdown terminal workspace
bind = $mainMod, grave, togglespecialworkspace, dropdown

# Refresh waybar
bind = $mainMod SHIFT, B, exec, killall -SIGUSR2 waybar

# Copy and save screenshots
bind = $mainMod, Print, exec, grimblast --notify copy area
bind = $mainMod SHIFT, Print, exec, grimblast --notify save area

# Control windows
bind = $mainMod, C, killactive
bind = $mainMod, T, togglesplit
bind = $mainMod, V, togglefloating
bind = $mainMod SHIFT, F, fullscreen

# Move focus with mainMod + vim keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Resize window with mainMod + shift + vim keys
binde = $mainMod SHIFT, h, resizeactive, -50 0
binde = $mainMod SHIFT, l, resizeactive, 50 0
binde = $mainMod SHIFT, k, resizeactive, 0 50
binde = $mainMod SHIFT, j, resizeactive, 0 -50

# Move window with mainMod + control + vim keys
binde = $mainMod CTRL, h, swapwindow, l
binde = $mainMod CTRL, l, swapwindow, r
binde = $mainMod CTRL, k, swapwindow, u
binde = $mainMod CTRL, j, swapwindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 1%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop

binde = , XF86KbdBrightnessUp, exec, brightnessctl -d *::kbd_backlight set +33%
binde = , XF86KbdBrightnessDown, exec, brightnessctl -d *::kbd_backlight set 33%-

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Persistent workspaces
workspace = name:1, monitor:DP-4, layoutopt:direction:left
workspace = name:2, monitor:DP-4, layoutopt:direction:left
workspace = name:3, monitor:DP-4, layoutopt:direction:left
workspace = name:4, monitor:DP-4, layoutopt:direction:left
workspace = name:5, monitor:DP-4, layoutopt:direction:left
workspace = name:6, monitor:DP-5
workspace = name:7, monitor:DP-5
workspace = name:8, monitor:DP-5
workspace = name:9, monitor:DP-5
workspace = special:dropdown, on-created-empty:[float; size monitor_w monitor_h*0.3 ; move 0 30] foot, gapsout:0, border:false

# QOL
windowrule = suppress_event maximize, match:class = .*

windowrule = idle_inhibit fullscreen, match:class = ^*$
windowrule = idle_inhibit fullscreen, match:title = ^*$
windowrule = idle_inhibit fullscreen, match:fullscreen = 1

windowrule = no_focus = true, match:class = steam, match:title = ^notificationtoasts_.*_desktop$

# Float these
windowrule = float = true, match:class = (dialog|splash|floating|pavucontrol|blueman-manager|imv|nm-connection-editor|org.pulseaudio.pavucontrol|nwg-look|engrampa|xarchiver)
windowrule = size 1100 900, match:class = (dialog|splash|floating|pavucontrol|blueman-manager|imv|nm-connection-editor|org.pulseaudio.pavucontrol|nwg-look|engrampa|xarchiver)

# Specifially for working on stuff
windowrule = float = true, match:title = Ekwos
windowrule = float = true, match:title = Heraclitus

# Layer rules
layerrule = animation slide, match:namespace = launcher
layerrule = blur = true, match:namespace = launcher
layerrule = ignore_alpha = 0, match:namespace = launcher

layerrule = animation slide, match:namespace = notifications
layerrule = blur = true, match:namespace = notifications
layerrule = ignore_alpha = 0, match:namespace = notifications

layerrule = animation slide, match:namespace = waybar
layerrule = blur = true, match:namespace = waybar
layerrule = ignore_alpha = 0, match:namespace = waybar
