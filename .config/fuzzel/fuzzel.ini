[main]
font=BlexMono Nerd Font:size=12
icon-theme="Gruvbox-Plus-Dark"
icons-enabled=yes
use-bold=yes
prompt="[RUN]: "
match-mode=fzf
match-counter=no
hide-before-typing=no
lines=20
layer=overlay
inner-pad=5
vertical-pad=10
horizontal-pad=10
launch-prefix="uwsm app -- "
dpi-aware=no
image-size-ratio=.5

[dmenu]
exit-immediately-if-empty=yes

[border]
width=2
radius=0

[colors]
background=121212ff
input=b14242ff
prompt=b14244ff
placeholder=b14242ff
text=d5d5d5ff
match=d5d5d5ff
selection=B14242ff
selection-text=d5d5d5ff
selection-match=4A8B8Bff
border=d5d5d5ff
